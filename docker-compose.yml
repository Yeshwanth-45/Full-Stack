version: '3.8'

services:
  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: foodiehub-mysql
    restart: always
    environment:
      MYSQL_DATABASE: foodiehub
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: foodieuser
      MYSQL_PASSWORD: foodiepassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Spring Boot Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodiehub-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/foodiehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JWT_SECRET: biterush-secret-key-for-jwt-token-generation-2026
      CORS_ALLOWED_ORIGINS: "*"

volumes:
  mysql_data:
